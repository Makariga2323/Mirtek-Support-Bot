<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чат поддержки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Чат поддержки</h1>
    <div id="messages"></div>
    <input id="text" type="text" placeholder="Ваш вопрос">
    <button id="send">Отправить</button>
    <button id="logout" class="link">Выйти</button>
  </main>

  <script>
    const token = localStorage.getItem("token");
    const messages = document.getElementById("messages");

    // Защита 2 уровня: серверная верификация сессии при открытии страницы
    async function checkAccess() {
      if (!token) { location.href = "index.html"; return; }
      try {
        const r = await fetch("http://localhost:8000/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token }),
        });
        if (!r.ok) {
          localStorage.removeItem("token");
          location.href = "index.html";
        }
      } catch (e) {
        addMessage("Внимание: Потеряно соединение с сервером авторизации.", "error");
      }
    }
    checkAccess();

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      messages.appendChild(div);
    }

    document.getElementById("send").onclick = async function () {
      const input = document.getElementById("text");
      const text = input.value.trim();
      if (text === "") return;

      addMessage(text, "user");
      input.value = "";

      try {
        // Отправка вопроса с токеном безопасности в заголовке запроса
        const r = await fetch("http://127.0.0.1:8000/api/login/api/v1/inquiries", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ text: text }),
        });

        if (r.status === 401) {
          localStorage.removeItem("token");
          location.href = "index.html";
          return;
        }

        const data = await r.json();
        
        setTimeout(function () {
          addMessage(data.answer, "bot");
          
          if (data.handoff_to_operator) {
            const btn = document.createElement("button");
            btn.textContent = "Отправить оператору";
            btn.onclick = function () {
              btn.disabled = true;
              addMessage("Запрос успешно передан специалисту через бэкенд", "status");
            };
            messages.appendChild(btn);
          }
        }, 1000);

      } catch (e) {
        addMessage("Ошибка отправки запроса: сервер не отвечает.", "error");
      }
    };

    document.getElementById("logout").onclick = function () {
      localStorage.removeItem("token");
      location.href = "index.html";
    };
  </script>
</body>
</html>
