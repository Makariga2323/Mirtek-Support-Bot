<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Вход</h1>
    <p>Введите токен 2 уровня защиты.</p>
    <input id="token" type="text" placeholder="Токен">
    <button id="login">Войти</button>
    <p id="error" class="error"></p>
  </main>

  <script>
    // При загрузке жестко не редиректим, пока сервер не подтвердит токен в чате.
    document.getElementById("login").onclick = async function () {
      const token = document.getElementById("token").value.trim();
      const error = document.getElementById("error");
      if (token === "") {
        error.textContent = "Введите токен";
        return;
      }
      try {
        const r = await fetch("http://127.0.0.1:8000/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token }),
        });
        if (r.ok) {
          localStorage.setItem("token", token);
          location.href = "chat.html";
        } else {
          error.textContent = "Неверный токен";
        }
      } catch (e) {
        error.textContent = "Сервер бэкенда недоступен";
      }
    };
  </script>
</body>
</html>
