<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Вход</h1>
    <p>Введите токен доступа.</p>
    <input id="token" type="text" placeholder="Токен">
    <button id="login">Войти</button>
    <p id="error" class="error"></p>
  </main>

  <script src="config.js"></script>
  <script>
    // Адрес сервера (API) задаётся в config.js
    // Уже входили: чат сам проверит сессию на сервере
    if (localStorage.getItem("user_token") && localStorage.getItem("session_id")) {
      location.href = "chat.html";
    }

    async function login() {
      const token = document.getElementById("token").value.trim();
      const error = document.getElementById("error");
      if (token === "") {
        error.textContent = "Введите токен";
        return;
      }
      try {
        const r = await fetch(API + "/api/v1/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token }),
        });
        if (r.status === 401) {
          error.textContent = "Неверный токен";
        } else if (!r.ok) {
          error.textContent = "Ошибка сервера (код " + r.status + "), смотрите терминал uvicorn";
        } else {
          const data = await r.json();
          localStorage.setItem("user_token", token);
          localStorage.setItem("session_id", data.session_id);
          location.href = "chat.html";
        }
      } catch (e) {
        error.textContent = "Нет связи с сервером. Запущен ли uvicorn на порту 8000?";
      }
    }

    document.getElementById("login").onclick = login;
    document.getElementById("token").onkeydown = function (e) {
      if (e.key === "Enter") login();
    };
  </script>
</body>
</html>
